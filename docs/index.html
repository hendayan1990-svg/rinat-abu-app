<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#702a42"><title>RINAT ABU · הבוטיק שלך</title><link rel="icon" href="icon.png"><style>
:root{--wine:#702a42;--paper:#faf7f2;--gold:#ad8a5d;--muted:#8a7e78}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#30272a;font-family:Arial,sans-serif}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;border:0}a{color:inherit}header{position:sticky;top:0;background:#faf7f2ed;backdrop-filter:blur(18px);z-index:3;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}header img{width:138px;height:54px;object-fit:contain}.round{background:white;color:var(--wine);width:46px;height:46px;border-radius:50%;display:grid;place-items:center}.round svg{width:23px;height:23px}main{max-width:780px;margin:auto;padding:8px 18px 115px}.status{font-size:11px;color:var(--muted);margin-bottom:20px}h1{font-size:29px;margin:8px 0 22px}h2{font-size:23px;margin:25px 0 16px}.muted{color:var(--muted);font-size:14px}.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(125deg,#552437,#85394e);padding:28px 23px;color:white;min-height:270px;margin-bottom:27px}.hero h2{font-size:32px;line-height:1.25;margin:16px 0 10px}.eyebrow{font-size:10px;letter-spacing:2px;color:#d7b991}.hero .art{position:absolute;left:-20px;bottom:8px;width:165px;height:200px;opacity:.75;transform:rotate(-12deg)}.hero .copy{position:relative;z-index:1}.cta{display:inline-block;text-decoration:none;background:var(--wine);color:white;padding:15px 20px;border-radius:17px;font-weight:bold}.hero .cta{background:#f1e4d4;color:var(--wine);margin-top:14px}input{width:100%;padding:17px;border:1px solid transparent;border-radius:18px;background:white;outline-color:var(--wine)}.tools{display:flex;align-items:center;justify-content:space-between;margin:16px 0}select{border:0;background:transparent;color:var(--wine);padding:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}.card{background:white;border-radius:22px;overflow:hidden;animation:enter .4s both}.photo{position:relative;background:#f2ede7}.photo>a{display:block;height:190px}.photo img{height:100%;width:100%;object-fit:contain;padding:8px}.heart{position:absolute;left:8px;top:8px;width:42px;height:42px;border-radius:50%;background:white;color:var(--wine);display:grid;place-items:center}.heart svg{width:22px}.heart.active svg{fill:currentColor}.meta{padding:13px;text-decoration:none;display:block}.meta h3{font-size:15px;line-height:1.5;height:45px;overflow:hidden;margin:7px 0}.price{font-size:21px;font-weight:bold;color:var(--wine)}del{font-size:11px;color:var(--muted);margin-inline-start:6px}.badge{font-size:10px;color:var(--gold)}nav{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:12px;right:12px;max-width:756px;margin:auto;background:#ffffffed;backdrop-filter:blur(20px);display:flex;padding:8px;border-radius:26px;box-shadow:0 5px 35px #41252a18;z-index:5}nav button{flex:1;background:transparent;color:var(--muted);border-radius:19px;min-height:56px;font-size:11px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}nav svg{width:23px;height:23px}nav .selected{background:#f4e8eb;color:var(--wine);font-weight:bold}.panel{padding:25px;background:white;border-radius:25px}.panel a{display:block;margin:18px 0}.gift{background:linear-gradient(120deg,#82394f,#502035);color:white;border-radius:26px;padding:35px;min-height:220px}.gift svg{width:60px;height:60px;color:#d8bb95}.empty{padding:50px 15px;text-align:center;color:var(--muted)}footer{font-size:12px;color:var(--muted);line-height:1.7;margin-top:25px}button:focus-visible,a:focus-visible{outline:3px solid #ad8a5d;outline-offset:3px}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pop{50%{transform:scale(1.22)}}.pop{animation:pop .3s}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.photo>a{height:230px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style></head><body><header><img src="logo.png" alt="רינת אבו"><button class="round" id="refresh" aria-label="רענון קטלוג">↻</button></header><main><div class="status" id="status" role="status">טוענים את הבוטיק…</div><div id="page"></div><footer>תצוגת דפדפן של האפליקציה · הרכישה והתשלום באתר רינת אבו. המחיר והזמינות הסופיים נקבעים באתר.</footer></main><nav aria-label="ניווט ראשי" id="nav"></nav><script>
const paths={home:'M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9',heart:'M12 21C8 17 2 13 2 7 2 1 9 0 12 6 15 0 22 1 22 7c0 6-6 10-10 14Z',gift:'M3 9h18v5H3zM5 14v8h14v-8M12 9v13M12 9C0 9 6-4 12 9c12 0 6-13 0 0Z',spark:'M12 2c2 7 3 8 10 10-7 2-8 3-10 10-2-7-3-8-10-10 7-2 8-3 10-10Z',user:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0M3 22a9 9 0 0 1 18 0'};
const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[k]}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=s=>{try{const u=new URL(s);return u.protocol==='https:'&&u.hostname==='rinatabu.com'?u.href:''}catch{return ''}};
let products=[],tab='home',query='',sort='default',limit=40,busy=false,favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('rinat-favorites')||'[]'))}catch{}
const money=n=>new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:2}).format(n);
function navigate(id){tab=id;query='';limit=40;render();window.scrollTo({top:0,behavior:'auto'})}
function render(){document.querySelector('#nav').innerHTML=[['home','בית','home'],['deals','דילים','spark'],['favorites','אהבתי','heart'],['gifts','מתנות','gift'],['account','שלי','user']].map(([id,t,i])=>`<button data-tab="${id}" class="${tab===id?'selected':''}" aria-current="${tab===id?'page':'false'}">${icon(i)}${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));const page=document.querySelector('#page');
if(tab==='gifts'){page.innerHTML=`<h1>לתת אהבה.<br>להשאיר את הבחירה.</h1><div class="gift">${icon('gift')}<h2>Gift Card</h2>מתנה מלאה באפשרויות</div><div class="panel"><a class="cta" href="https://rinatabu.com/gift-card/">לגיפטכארד באתר רינת</a><p class="muted">כרטיסים שהונפקו בניהול האפליקציה ממומשים מול רינת ואינם מחוברים לקופה באתר.</p></div>`;return}
if(tab==='account'){page.innerHTML=`<h1>הבוטיק שלך</h1><div class="panel"><b>RINAT ABU · תצוגה בדפדפן</b><a class="cta" href="https://wa.me/972549808826">שירות אישי בוואטסאפ</a><a href="https://github.com/hendayan1990-svg/rinat-abu-app/releases/latest">גרסאות Android ב־GitHub</a><p class="muted">גרסת האייפון המקורית ממתינה לחתימה ולהפצה. אפשר להשתמש בתצוגה הזו ישירות בדפדפן.</p></div>`;return}
page.innerHTML=(tab==='home'?`<p class="muted">רגעים קטנים. מתנות גדולות.</p><h1>משהו יפה מחכה לך</h1><section class="hero"><div class="art">${icon('gift')}</div><div class="copy"><div class="eyebrow">THE ART OF GIVING</div><h2>נבחר באהבה.<br>ניתן מכל הלב.</h2><div>מתנות עם משמעות</div><button class="cta" id="deals">לגלות את המבצעים</button></div></section>`:'')+`<h2>${tab==='favorites'?'האהובים שלך':tab==='deals'?'דילים שעושים טוב בלב':'נבחרו בשבילך'}</h2><input id="search" placeholder="חיפוש פריט או קולקציה" aria-label="חיפוש מוצרים" value="${esc(query)}"><div class="tools"><span class="muted" id="count"></span><select id="sort" aria-label="מיון"><option value="default">סדר הקולקציה</option><option value="low">מחיר עולה</option><option value="discount">ההנחות הגדולות</option></select></div><div id="grid" class="grid"></div><button class="cta" id="more" style="margin-top:20px">מוצרים נוספים</button>`;
document.querySelector('#deals')?.addEventListener('click',()=>navigate('deals'));document.querySelector('#search').oninput=e=>{query=e.target.value;limit=40;grid()};document.querySelector('#sort').value=sort;document.querySelector('#sort').onchange=e=>{sort=e.target.value;grid()};document.querySelector('#more').onclick=()=>{limit+=40;grid()};grid()}
function grid(){const target=document.querySelector('#grid');if(!target)return;let list=products.filter(p=>(tab!=='favorites'||favs.has(p.id))&&(tab!=='deals'||p.sale)&&(p.name+' '+p.category).includes(query.trim()));if(sort==='low')list.sort((a,b)=>a.price-b.price);if(sort==='discount')list.sort((a,b)=>(b.old-b.price)-(a.old-a.price));document.querySelector('#count').textContent=list.length+' פריטים';target.innerHTML=list.slice(0,limit).map(p=>`<article class="card"><div class="photo"><a href="${esc(safe(p.url))}" aria-label="${esc(p.name)}"><img loading="lazy" src="${esc(safe(p.image))}" alt="${esc(p.name)}"></a><button class="heart ${favs.has(p.id)?'active':''}" data-fav="${p.id}" aria-label="שמירה במועדפים" aria-pressed="${favs.has(p.id)}">${icon('heart')}</button></div><a class="meta" href="${esc(safe(p.url))}"><span class="badge">${p.sale?'במחיר מיוחד':'RINAT ABU'}</span><h3>${esc(p.name)}</h3><span class="price">${money(p.price)}</span>${p.old>p.price?`<del>${money(p.old)}</del>`:''}${!p.stock?'<p class="muted">אזל מהמלאי</p>':''}</a></article>`).join('')||'<p class="empty">לא נמצאו פריטים. אפשר לשנות חיפוש או לשמור מוצרים עם הלב.</p>';document.querySelector('#more').hidden=list.length<=limit;target.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.fav);favs.has(id)?favs.delete(id):favs.add(id);try{localStorage.setItem('rinat-favorites',JSON.stringify([...favs]))}catch{}b.classList.toggle('active',favs.has(id));b.setAttribute('aria-pressed',favs.has(id));b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');if(tab==='favorites')grid()})}
async function sync(){if(busy)return;busy=true;const status=document.querySelector('#status');status.textContent='בודקים עדכונים מהאתר…';try{let all=[],pages=1,total=-1;for(let page=1;page<=pages;page++){const r=await fetch(`https://rinatabu.com/wp-json/wc/store/v1/products?per_page=100&orderby=id&order=asc&page=${page}`,{signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error();const n=Number(r.headers.get('X-WP-TotalPages')),t=Number(r.headers.get('X-WP-Total'));if(page===1){pages=n;total=t;if(!n||n>50||!t||t>5000)throw Error()}else if(n!==pages||t!==total)throw Error();const data=await r.json();all.push(...data)}if(all.length!==total||new Set(all.map(p=>p.id)).size!==total)throw Error();products=all.map(p=>{if(p.prices.currency_code!=='ILS')throw Error();const factor=10**p.prices.currency_minor_unit;const decoder=document.createElement('textarea');decoder.innerHTML=p.name;return{id:p.id,name:decoder.value,url:p.permalink,image:p.images[0]?.thumbnail||p.images[0]?.src,price:Number(p.prices.price)/factor,old:Number(p.prices.regular_price)/factor,sale:p.on_sale,stock:p.is_in_stock,category:p.categories.map(c=>c.name).join(' ')}});status.textContent='עודכן מהאתר · '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});grid()}catch{status.textContent='מוצג קטלוג תצוגה שמור · מחיר וזמינות עדכניים בעמוד המוצר'}finally{busy=false}}
(async()=>{try{const r=await fetch('products.json');if(!r.ok)throw Error();products=await r.json();render();sync()}catch{document.querySelector('#status').textContent='טעינת הקטלוג נכשלה. נסו לרענן.'}})();document.querySelector('#refresh').onclick=sync;setInterval(()=>{if(!document.hidden)sync()},300000);
</script></body></html>
