<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf7f2"><title>RINAT ABU · הבוטיק שלך</title><link rel="icon" href="icon.png"><style>
@font-face{font-family:Heebo;src:url(fonts/Heebo.ttf) format("truetype");font-weight:100 900;font-display:swap}
:root{--wine:#702a42;--paper:#faf7f2;--gold:#ad8a5d;--muted:#8a7e78}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#30272a;font-family:Heebo,Arial,sans-serif}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;border:0}a{color:inherit}header{position:sticky;top:0;background:#faf7f2ed;backdrop-filter:blur(18px);z-index:3;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}header img{width:138px;height:54px;object-fit:contain}.round{background:white;color:var(--wine);width:46px;height:46px;border-radius:50%;display:grid;place-items:center}.round svg{width:23px;height:23px}main{max-width:780px;margin:auto;padding:8px 18px 115px}.status{font-size:11px;color:var(--muted);margin-bottom:20px}h1{font-size:29px;margin:8px 0 22px}h2{font-size:23px;margin:25px 0 16px}.muted{color:var(--muted);font-size:14px}.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(125deg,#552437,#85394e);padding:28px 23px;color:white;min-height:270px;margin-bottom:27px}.hero h2{font-size:32px;line-height:1.25;margin:16px 0 10px}.eyebrow{font-size:10px;letter-spacing:2px;color:#d7b991}.hero .art{position:absolute;left:-20px;bottom:8px;width:165px;height:200px;opacity:.75;transform:rotate(-12deg)}.hero .copy{position:relative;z-index:1}.cta{display:inline-block;text-decoration:none;background:var(--wine);color:white;padding:15px 20px;border-radius:17px;font-weight:bold}.hero .cta{background:#f1e4d4;color:var(--wine);margin-top:14px}input{width:100%;padding:17px;border:1px solid transparent;border-radius:18px;background:white;outline-color:var(--wine)}.tools{display:flex;align-items:center;justify-content:space-between;margin:16px 0}select{border:0;background:transparent;color:var(--wine);padding:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}.card{background:white;border-radius:22px;overflow:hidden;animation:enter .4s both}.photo{position:relative;background:#f2ede7}.photo>a{display:block;height:190px}.photo img{height:100%;width:100%;object-fit:contain;padding:8px}.heart{position:absolute;left:8px;top:8px;width:42px;height:42px;border-radius:50%;background:white;color:var(--wine);display:grid;place-items:center}.heart svg{width:22px}.heart.active svg{fill:currentColor}.meta{padding:13px;text-decoration:none;display:block}.meta h3{font-size:15px;line-height:1.5;height:45px;overflow:hidden;margin:7px 0}.price{font-size:21px;font-weight:bold;color:var(--wine)}del{font-size:11px;color:var(--muted);margin-inline-start:6px}.badge{font-size:10px;color:var(--gold)}nav{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:12px;right:12px;max-width:756px;margin:auto;background:#ffffffed;backdrop-filter:blur(20px);display:flex;padding:8px;border-radius:26px;box-shadow:0 5px 35px #41252a18;z-index:5}nav button{flex:1;background:transparent;color:var(--muted);border-radius:19px;min-height:56px;font-size:11px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}nav svg{width:23px;height:23px}nav .selected{background:#f4e8eb;color:var(--wine);font-weight:bold}.panel{padding:25px;background:white;border-radius:25px}.panel a{display:block;margin:18px 0}.gift{background:linear-gradient(120deg,#82394f,#502035);color:white;border-radius:26px;padding:35px;min-height:220px}.gift svg{width:60px;height:60px;color:#d8bb95}.empty{padding:50px 15px;text-align:center;color:var(--muted)}footer{font-size:12px;color:var(--muted);line-height:1.7;margin-top:25px}button:focus-visible,a:focus-visible{outline:3px solid #ad8a5d;outline-offset:3px}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pop{50%{transform:scale(1.22)}}.pop{animation:pop .3s}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.photo>a{height:230px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}

.status{font-size:10px;margin:0;max-height:0;overflow:hidden}.hero{padding:0;min-height:380px;background:#e5dcd4;isolation:isolate}.hero>img{position:absolute;width:100%;height:100%;object-fit:cover;inset:0;animation:reveal 1.1s cubic-bezier(.2,.7,.3,1) both}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#25121ed9,transparent 85%);z-index:0}.hero .copy{padding:28px;position:absolute;bottom:0}.hero h2{font-size:34px;letter-spacing:-1px}.hero .cta{font-size:13px;background:#fff5e8}.collections{display:flex;gap:14px;overflow:auto;margin:0 -4px 28px;padding:4px}.collection{min-width:100px;width:100px;background:transparent;text-align:center;font-size:12px;font-weight:600;color:#30272a}.collection img{width:100%;height:105px;object-fit:cover;border-radius:22px;display:block;margin-bottom:9px}.offer{width:100%;background:#efe4df;text-align:right;border-radius:20px;padding:22px;color:var(--wine);display:flex;align-items:center;gap:14px}.offer svg{width:32px;flex-shrink:0}.offer small{display:block;color:var(--muted);margin-top:4px}.photo>a{height:220px}.card{box-shadow:0 3px 12px #3b213807;animation:enter .6s both}.card:nth-child(2n){animation-delay:.09s}.card:nth-child(3n){animation-delay:.16s}.meta h3{font-weight:600}.meta:after{content:'לפרטים ולבחירה ←';display:block;color:var(--muted);font-size:10px;margin-top:12px}#page{animation:enter .5s both}button,.cta{transition:transform .18s ease,background .2s ease}button:active,.cta:active{transform:scale(.96)}.gift{position:relative;overflow:hidden;box-shadow:0 16px 35px #50203520;background:linear-gradient(120deg,#995467,#4b2032)}.gift:after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,#ffffff18 50%,transparent 70%);transform:translateX(-100%);animation:shine 1.8s .5s both;pointer-events:none}.amounts{display:flex;gap:10px;margin:18px 0}.amounts button{flex:1;padding:15px 8px;border-radius:16px;color:var(--wine);background:#efe4df}.amounts button.selected{background:var(--wine);color:white}#gift-amount{font-size:34px;color:#f2dcc0;font-weight:600}.admin{font-size:13px;color:var(--muted);text-align:center;margin:30px}.lead{font-size:15px;color:var(--muted);margin-top:-12px}footer{font-size:10px}@keyframes reveal{from{transform:scale(1.06);opacity:.3}to{transform:scale(1);opacity:1}}@keyframes shine{to{transform:translateX(100%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header><img src="logo.png" alt="רינת אבו"><button class="round" id="refresh" aria-label="רענון קטלוג">↻</button></header><main><div class="status" id="status" role="status">טוענים את הבוטיק…</div><div id="page"></div><footer>הרכישה באתר רינת אבו · המחיר והזמינות הסופיים בעמוד המוצר.</footer></main><nav aria-label="ניווט ראשי" id="nav"></nav><script>
const paths={home:'M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9',heart:'M12 21C8 17 2 13 2 7 2 1 9 0 12 6 15 0 22 1 22 7c0 6-6 10-10 14Z',gift:'M3 9h18v5H3zM5 14v8h14v-8M12 9v13M12 9C0 9 6-4 12 9c12 0 6-13 0 0Z',spark:'M12 2c2 7 3 8 10 10-7 2-8 3-10 10-2-7-3-8-10-10 7-2 8-3 10-10Z',user:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0M3 22a9 9 0 0 1 18 0'};
const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[k]}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=s=>{try{const u=new URL(s);return u.protocol==='https:'&&u.hostname==='rinatabu.com'?u.href:''}catch{return ''}};
let snapshots=new Map();let products=[],tab='home',query='',sort='default',limit=40,busy=false,favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('rinat-favorites')||'[]'))}catch{}
function photo(p){if(!p)return 'logo.png';return snapshots.get(p.id)===p.image?'catalog/'+p.id+'.img':safe(p.image)}
const money=n=>new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:2}).format(n);
function navigate(id){tab=id;query='';limit=40;render();window.scrollTo({top:0,behavior:'auto'})}
function render(){document.querySelector('#nav').innerHTML=[['home','בית','home'],['deals','דילים','spark'],['favorites','אהבתי','heart'],['gifts','גיפטכארד','gift'],['account','שלי','user']].map(([id,t,i])=>`<button data-tab="${id}" class="${(tab===id||(id==='home'&&tab==='catalog'))?'selected':''}" aria-current="${tab===id?'page':'false'}">${icon(i)}${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));const page=document.querySelector('#page');page.style.animation='none';void page.offsetWidth;page.style.animation='';
if(tab==='gifts'){page.innerHTML=`<h1>מתנה אחת.<br>כל כך הרבה אפשרויות.</h1><p class="lead">בוחרים סכום, מוסיפים אהבה</p><div class="gift"><div class="eyebrow">RINAT ABU</div><h2>Gift Card</h2><div id="gift-amount">₪250</div><p>מתנה עם משמעות · בקשה אישית</p></div><h2>באיזה סכום תרצו לפנק?</h2><div class="amounts">${[100,250,500].map(n=>`<button data-amount="${n}" class="${n===250?'selected':''}">${money(n)}</button>`).join('')}</div><p class="muted">אלו סכומים מוצעים לבקשה מרינת. אין חיוב או הנפקת כרטיס במסך הזה; התשלום, התוקף והתנאים יתואמו מול רינת.</p><a class="cta" id="gift-request" href="#">לתיאום גיפטכארד עם רינת ←</a><h2>יש לך כבר גיפטכארד?</h2><p class="muted">לבדיקת יתרה ומימוש, פנו לשירות האישי.</p><a href="https://wa.me/972549808826">עזרה במימוש כרטיס</a>`;const choose=n=>{document.querySelector('#gift-amount').textContent=money(n);document.querySelector('#gift-request').href='https://wa.me/972549808826?text='+encodeURIComponent('שלום רינת, אשמח לתאם רכישת גיפטכארד בסכום '+n+' שקלים. מה אפשרויות התשלום והתוקף?');document.querySelectorAll('[data-amount]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.amount)===n))};document.querySelectorAll('[data-amount]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.amount)));choose(250);return}
if(tab==='account'){page.innerHTML=`<h1>הבוטיק שלך</h1><p class="lead">כל מה שאהבת, במקום אחד</p><div class="panel"><h2>הפריטים שאהבת</h2><p class="muted">${favs.size} פריטים שמורים מחכים לך</p><button class="cta" id="saved">למועדפים שלי</button></div><div class="panel" style="margin-top:20px"><a href="https://wa.me/972549808826">שירות אישי בוואטסאפ</a><button class="cta" id="gift-link">לבחירת מתנה</button></div><div class="admin"><a href="https://rinat-abu-boutique.soundheron64.chatgpt.site/admin">כניסת מנהלת</a></div>`;document.querySelector('#saved').onclick=()=>navigate('favorites');document.querySelector('#gift-link').onclick=()=>navigate('gifts');return}
const featured=products.find(p=>p.id===14801)||products[0];
page.innerHTML=(tab==='home'?`<div class="eyebrow" style="color:var(--gold);margin:12px 0">THE RINAT ABU EDIT</div><h1>בית של רגעים יפים</h1><p class="lead">יודאיקה, מתנות והפרטים שעושים בית</p><section class="hero"><img src="${esc(photo(featured))}" alt="${esc(featured?.name||'')}"><div class="copy"><div class="eyebrow">THE GIFT COLLECTION</div><h2>מתנות שנשארות בלב</h2><button class="cta" data-collection="מארז">לגלות את הקולקציה ←</button></div></section><h2>לכל רגע, הבחירה שלו</h2><div class="collections">${[['מארז','מתנות באהבה'],['נרות','אור לשבת'],['טלית','רגע של תפילה'],['הבדלה','לשבוע טוב']].map(([q,t])=>{const p=products.find(p=>p.name.includes(q));return `<button class="collection" data-collection="${q}"><img src="${esc(photo(p))}" alt="">${t}</button>`}).join('')}</div><button class="offer" id="deals">${icon('spark')}<span><b>בחירות יפות. מחירים מיוחדים.</b><small>לכל המבצעים של הבוטיק ←</small></span></button>`:'')+`<h2>${tab==='favorites'?'האהובים שלך':tab==='deals'?'דילים שעושים טוב בלב':'נבחרו בשבילך'}</h2><input id="search" placeholder="חיפוש פריט או קולקציה" aria-label="חיפוש מוצרים" value="${esc(query)}"><div class="tools"><span class="muted" id="count"></span><select id="sort" aria-label="מיון"><option value="default">סדר הקולקציה</option><option value="low">מחיר עולה</option><option value="discount">ההנחות הגדולות</option></select></div><div id="grid" class="grid"></div><button class="cta" id="more" style="margin-top:20px">מוצרים נוספים</button>`;
document.querySelectorAll('[data-collection]').forEach(b=>b.onclick=()=>{tab='catalog';query=b.dataset.collection;limit=40;render();window.scrollTo(0,0)});document.querySelector('#deals')?.addEventListener('click',()=>navigate('deals'));document.querySelector('#search').oninput=e=>{query=e.target.value;limit=40;grid()};document.querySelector('#sort').value=sort;document.querySelector('#sort').onchange=e=>{sort=e.target.value;grid()};document.querySelector('#more').onclick=()=>{limit+=40;grid()};grid()}
function grid(){const target=document.querySelector('#grid');if(!target)return;let list=products.filter(p=>(tab!=='favorites'||favs.has(p.id))&&(tab!=='deals'||p.sale)&&(p.name+' '+p.category).includes(query.trim()));if(sort==='low')list.sort((a,b)=>a.price-b.price);if(sort==='discount')list.sort((a,b)=>(b.old-b.price)-(a.old-a.price));document.querySelector('#count').textContent=list.length+' פריטים';target.innerHTML=list.slice(0,limit).map(p=>`<article class="card"><div class="photo"><a href="${esc(safe(p.url))}" aria-label="${esc(p.name)}"><img loading="lazy" src="${esc(photo(p))}" alt="${esc(p.name)}"></a><button class="heart ${favs.has(p.id)?'active':''}" data-fav="${p.id}" aria-label="שמירה במועדפים" aria-pressed="${favs.has(p.id)}">${icon('heart')}</button></div><a class="meta" href="${esc(safe(p.url))}"><span class="badge">${p.sale?'במחיר מיוחד':'RINAT ABU'}</span><h3>${esc(p.name)}</h3><span class="price">${money(p.price)}</span>${p.old>p.price?`<del>${money(p.old)}</del>`:''}${!p.stock?'<p class="muted">אזל מהמלאי</p>':''}</a></article>`).join('')||'<p class="empty">לא נמצאו פריטים. אפשר לשנות חיפוש או לשמור מוצרים עם הלב.</p>';document.querySelector('#more').hidden=list.length<=limit;target.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.fav);favs.has(id)?favs.delete(id):favs.add(id);try{localStorage.setItem('rinat-favorites',JSON.stringify([...favs]))}catch{}b.classList.toggle('active',favs.has(id));b.setAttribute('aria-pressed',favs.has(id));b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');if(tab==='favorites')grid()})}
async function sync(){if(busy)return;busy=true;const status=document.querySelector('#status');status.textContent='בודקים עדכונים מהאתר…';try{let all=[],pages=1,total=-1;for(let page=1;page<=pages;page++){const r=await fetch(`https://rinatabu.com/wp-json/wc/store/v1/products?per_page=100&orderby=id&order=asc&page=${page}`,{signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error();const n=Number(r.headers.get('X-WP-TotalPages')),t=Number(r.headers.get('X-WP-Total'));if(page===1){pages=n;total=t;if(!n||n>50||!t||t>5000)throw Error()}else if(n!==pages||t!==total)throw Error();const data=await r.json();all.push(...data)}if(all.length!==total||new Set(all.map(p=>p.id)).size!==total)throw Error();products=all.map(p=>{if(p.prices.currency_code!=='ILS')throw Error();const factor=10**p.prices.currency_minor_unit;const decoder=document.createElement('textarea');decoder.innerHTML=p.name;return{id:p.id,name:decoder.value,url:p.permalink,image:p.images[0]?.src||p.images[0]?.thumbnail,price:Number(p.prices.price)/factor,old:Number(p.prices.regular_price)/factor,sale:p.on_sale,stock:p.is_in_stock,category:p.categories.map(c=>c.name).join(' ')}});status.textContent='עודכן מהאתר · '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});grid()}catch{status.textContent='מוצג קטלוג תצוגה שמור · מחיר וזמינות עדכניים בעמוד המוצר'}finally{busy=false}}
(async()=>{try{const r=await fetch('products.json');if(!r.ok)throw Error();products=await r.json();snapshots=new Map(products.map(p=>[p.id,p.image]));render();sync()}catch{document.querySelector('#status').textContent='טעינת הקטלוג נכשלה. נסו לרענן.'}})();document.querySelector('#refresh').onclick=sync;setInterval(()=>{if(!document.hidden)sync()},300000);
</script></body></html>
